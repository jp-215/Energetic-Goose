# Optional: a local Neo4j for the evaluation interaction graph.
#
#   docker compose -f docker-compose.neo4j.yml up -d
#   # then in your .env:
#   NEO4J_URI=bolt://localhost:7687
#   NEO4J_USER=neo4j
#   NEO4J_PASSWORD=evaluation
#
# Browser UI: http://localhost:7474  (same credentials)
# Without this, the service falls back to an in-memory graph persisted to
# services/court-orchestrator/var/graph.json — same schema, same API.
services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/evaluation
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
